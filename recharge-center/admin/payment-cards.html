<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><script src="/admin/session.js"></script><title>支付卡池｜GPTC 后台</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#f5f8fa;color:#172b36;font:15px system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:1240px;margin:auto}section{background:#fff;border:1px solid #dbe7e5;border-radius:16px;padding:24px;margin:0 0 18px;box-shadow:0 8px 28px #0e46390a}h1,h2{margin:0 0 8px}h1{font-size:29px}h2{font-size:20px}p{color:#657983;line-height:1.6;margin:8px 0}.top,.actions,.filters,.stats{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.top{justify-content:space-between}.stats{margin-top:18px}.stat{padding:12px 16px;background:#f1f8f6;border:1px solid #d7ebe4;border-radius:10px;min-width:130px}.stat strong{display:block;font-size:22px;color:#0c7059}.stat small{color:#657983}.actions{margin-top:14px}.bulkbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:14px 0;padding:12px;background:#f2f8f6;border:1px solid #d5e9e2;border-radius:10px}.bulkbar button{padding:7px 11px}.bulkbar strong{color:#0c7059}.card-select{width:18px;height:18px;vertical-align:middle;margin-right:10px;accent-color:#0d795d}.history-list{display:grid;gap:8px;margin-top:10px}.history-item{padding:10px 12px;background:#fff;border:1px solid #e2ebe8;border-radius:9px;min-width:0}.history-email{font-weight:700;overflow-wrap:anywhere}.history-meta{display:flex;gap:6px 14px;flex-wrap:wrap;color:#72838a;font-size:12px;margin-top:4px}.history-meta code{overflow-wrap:anywhere;color:#47646b}.detailbox>div{min-width:0}button,input,textarea{font:inherit;border-radius:9px}button{border:1px solid #0d795d;background:#0d795d;color:#fff;padding:9px 14px;font-weight:700;cursor:pointer}button.secondary{background:#fff;color:#0d7056;border-color:#baded2}button.danger{background:#fff4f4;color:#b42335;border-color:#f2b8c0}button:disabled{opacity:.5;cursor:not-allowed}input,textarea{border:1px solid #c7d8d4;padding:10px;max-width:100%}input[type=number]{width:86px}textarea{display:block;width:100%;min-height:95px;margin:10px 0}.status{margin-top:14px;padding:10px 12px;border-radius:9px;background:#eff8f5;color:#0b6b52;white-space:pre-wrap}.status.error{background:#fff1f2;color:#a92034}.filters{margin:16px 0}.filters button{background:#fff;color:#4d6269;border-color:#d7e2e1}.filters button.active{background:#0d795d;color:white;border-color:#0d795d}#search{flex:1;min-width:230px}.table{overflow:auto}table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid #e5eded;padding:12px 10px;text-align:left;vertical-align:top}th{color:#688087;font-size:13px;white-space:nowrap}td{min-width:90px}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#e8f5ee;color:#087454;font-size:12px;font-weight:800}.badge.warn{background:#fff3e8;color:#ab5b08}.badge.off{background:#f2f4f5;color:#66757c}.muted{color:#72838a;font-size:13px}.detail td{background:#f8fbfa}.detailbox{display:grid;grid-template-columns:1fr 1fr;gap:14px}.detailbox .actions{grid-column:1/-1}.detailbox p{margin:4px 0}.detailbox label{display:inline-flex;gap:7px;align-items:center}.count{white-space:nowrap}.count strong{font-size:17px}.count .frozen{color:#bc660b}.pager{display:flex;justify-content:flex-end;gap:10px;align-items:center;margin-top:15px}.import-grid{display:grid;grid-template-columns:1fr 1fr 140px;gap:10px}.import-grid label{display:grid;gap:6px;font-weight:700}.import-grid input{width:100%}details.import{margin-top:0}details.import summary{cursor:pointer;font-size:20px;font-weight:800}#previewRows p{font-size:13px;margin:4px 0}@media(max-width:720px){body{padding:12px}section{padding:17px}.detailbox,.import-grid{grid-template-columns:1fr}.stats .stat{flex:1}.table{margin:0 -17px}.filters button{flex:1}}
</style></head><body><main>
<section><div class="top"><div><h1>支付卡池</h1><p>所有支付卡在同一列表管理。按可用次数轮选；失败先冻结本次次数，核查后在充值订单中处理。</p></div><a href="/admin#protocol-settings">切换 Plus 协议</a></div><div class="stats" id="stats"></div><div class="actions"><button id="sync">同步嗨付卡片</button><button class="secondary" id="reload">刷新列表</button><a href="/admin/recoveries">查看充值订单</a></div><div class="status" id="notice">正在加载支付卡池…</div></section>
<section><details class="import" id="importPanel" open><summary>导入手动支付卡</summary><p>每行一张，支持“卡号,MM/YY,CVV”或“卡号 CVV YYYY-MM”。卡号和 CVV 加密留存，列表仅显示尾号。导入时设置总可用次数。</p><p id="importStatus"></p><textarea id="importText" autocomplete="off" spellcheck="false" placeholder="每行一张支付卡"></textarea><div class="import-grid"><label>来源<input id="source" value="手动导入" maxlength="40"></label><label>备注<input id="note" maxlength="200"></label><label>总可用次数<input id="cap" type="number" min="1" max="100" value="1"></label></div><div class="actions"><label><input id="enabled" type="checkbox" checked> 导入后启用</label><button class="secondary" id="preview">脱敏预览</button><button id="import" disabled>确认导入</button></div><div id="previewRows"></div></details></section>
<section><div class="top"><div><h2>全部支付卡</h2><p>“适用协议”按卡片来源和实时状态展示。嗨付来源卡共用嗨付与 ZZS 的次数；手动导入卡目前由 ZZS 协议使用。</p></div><strong id="total">0 张</strong></div><div class="filters" id="filters"></div><div class="filters"><input id="search" type="search" placeholder="搜索卡片 ID、尾号、来源、账号或备注"></div><div class="bulkbar" id="bulkbar"><strong id="selectedCount">已选 0 张</strong><button class="secondary" id="selectPage" type="button">选择本页</button><button class="secondary" id="clearSelection" type="button">清空选择</button><button data-bulk="enable" type="button">批量启用</button><button class="secondary" data-bulk="disable" type="button">批量停用</button><button class="secondary" data-bulk="cap" type="button">批量设置总次数</button></div><div class="table"><table><thead><tr><th>选择 / 支付卡</th><th>适用协议</th><th>次数</th><th>余额</th><th>状态</th><th>操作</th></tr></thead><tbody id="cards"></tbody></table></div><div class="pager"><button class="secondary" id="prev">上一页</button><span id="pageInfo"></span><button class="secondary" id="next">下一页</button></div></section>
</main><script>
const $=id=>document.getElementById(id),api=(path,body)=>window.adminApi(path,body===undefined?{}:{method:'POST',body:JSON.stringify(body)}),esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let cards=[],filter='all',page=0,ready=false,bulkBusy=false;const expanded=new Set(),selected=new Set(),pageSize=20;
const notice=(value,error=false)=>{$('notice').textContent=value;$('notice').classList.toggle('error',error)};
function normalize(h,manual){return [
 ...h.map(c=>({...c,kind:'h',uid:'h:'+c.id,sourceLabel:'嗨付同步',used:(c.usedCount||0),frozen:(c.frozenCount||0),max:(c.maxUses||0),remaining:(c.remainingUses||0),state:c.enabled?c.poolStatus:'disabled',channels:c.proProtected||c.pro5xSelected?[]:c.poolStatus==='ready'?['嗨付','ZZS']:c.poolStatus==='high_balance'?['ZZS']:[]})),
 ...manual.filter(c=>c.credentialSource==='manual').map(c=>({...c,kind:'manual',uid:'manual:'+c.id,sourceLabel:c.source||'手动导入',used:c.successCount||0,frozen:c.frozenUses||0,max:c.maxSuccess||0,remaining:c.remainingUses||0,state:!c.enabled?'disabled':c.paused?'paused':c.remainingUses===0?'uses_exhausted':c.occupiedOrderId?'reserved':'ready',channels:c.enabled&&!c.paused&&c.remainingUses>0?['ZZS']:[]}))
].sort((a,b)=>(Number(a.priority)||0)-(Number(b.priority)||0)||String(a.createdAt||'').localeCompare(String(b.createdAt||''))||String(a.uid).localeCompare(String(b.uid)))}
function category(c){if(c.state==='disabled')return'disabled';if(c.channels.length)return'ready';return'attention'}
function cardText(c){return [c.id,c.lastFour,c.sourceLabel,c.note,c.status,c.state,...(c.plusUsers||[]).flatMap(x=>[x.email,x.accountId]),...(c.successfulAccounts||[]).flatMap(x=>[x.email,x.accountId])].join(' ').toLowerCase()}
function historyAccount(a,pending=false){const email=esc(a.email||'未知邮箱'),account=esc(a.accountId||'未留存 UUID'),date=a.submittedAt?esc(new Date(a.submittedAt).toLocaleString('zh-CN',{hour12:false})):'';return '<div class="history-item"><div class="history-email">'+(pending?'<span class="badge warn">待核查</span> ':'')+email+'</div><div class="history-meta"><code>UUID '+account+'</code>'+(date?'<time>'+date+'</time>':'')+'</div></div>'}
function detail(c){const id=esc(c.id);if(c.kind==='manual'){const accounts=(c.successfulAccounts||[]).map(a=>historyAccount(a)).join('')||'<div class="muted">暂无成功记录</div>';return '<div class="detailbox"><div><strong>历史充值账号</strong><div class="history-list">'+accounts+(c.pendingAccount?historyAccount(c.pendingAccount,true):'')+'</div></div><div><strong>卡片信息</strong><p>来源：'+esc(c.sourceLabel)+'</p><p>备注：'+esc(c.note||'—')+'</p><p>手动导入卡由 ZZS 协议使用。</p></div><div class="actions"><button class="secondary" data-action="manual-cap" data-id="'+id+'">调整次数与备注</button><button class="secondary" data-action="manual-toggle" data-id="'+id+'">'+(c.enabled?'停用':'启用')+'</button><button class="danger" data-action="manual-retire" data-id="'+id+'" '+(c.occupiedOrderId?'disabled':'')+'>移出卡池</button></div></div>'}
const accounts=(c.plusUsers||[]).map(a=>historyAccount(a)).join('')||'<div class="muted">暂无成功记录</div>';const pending=(c.inFlightOrders||[]).map(x=>'<div class="history-item">'+historyAccount(x,true)+'<button class="secondary" data-action="release" data-id="'+id+'" data-order-id="'+esc(x.orderId)+'">核查未扣款后释放</button></div>').join('');const pro=c.proReservation;return '<div class="detailbox"><div><strong>历史充值账号</strong><div class="history-list">'+accounts+'</div></div><div><strong>卡片信息</strong><p>同步状态：'+esc(c.status||'未知')+' · 最近同步：'+esc(c.lastSeenAt||'—')+'</p><p>Pro 保护：'+(pro?esc(pro.type||'Pro')+' · '+esc(pro.account||''):'未设置')+'</p>'+pending+'</div><div class="actions"><label>轮选顺序 <input type="number" min="0" data-setting="priority" data-id="'+id+'" value="'+esc(c.priority||0)+'"></label><label>总次数 <input type="number" min="1" max="100" data-setting="maxUses" data-id="'+id+'" value="'+esc(c.max)+'"></label><button class="secondary" data-action="protect-pro" data-id="'+id+'">'+(c.proProtected?'修改 Pro 保护':'设置 Pro 保护')+'</button>'+(c.proProtected?'<button class="secondary" data-action="release-pro" data-id="'+id+'">解除 Pro 保护</button>':'')+'<button class="secondary" data-action="'+(c.enabled?'disable':'enable')+'" data-id="'+id+'">'+(c.enabled?'停用':'启用')+'</button></div></div>'}
function render(){const counts={all:cards.length,ready:0,attention:0,disabled:0};for(const c of cards)counts[category(c)]++;$('stats').innerHTML='<div class="stat"><strong>'+cards.length+'</strong><small>卡池总数</small></div><div class="stat"><strong>'+counts.ready+'</strong><small>可用</small></div><div class="stat"><strong>'+cards.filter(c=>category(c)==='ready').reduce((n,c)=>n+c.remaining,0)+'</strong><small>当前可轮选次数</small></div><div class="stat"><strong>'+cards.reduce((n,c)=>n+c.remaining,0)+'</strong><small>卡池剩余总次数（含不可轮选）</small></div><div class="stat"><strong>'+cards.reduce((n,c)=>n+c.frozen,0)+'</strong><small>冻结次数</small></div>';
const filters=[['all','全部'],['ready','可用'],['attention','需处理'],['disabled','已停用']];$('filters').innerHTML=filters.map(([key,label])=>'<button data-filter="'+key+'" class="'+(filter===key?'active':'')+'">'+label+' '+counts[key]+'</button>').join('');const search=$('search').value.trim().toLowerCase();const shown=cards.filter(c=>(filter==='all'||category(c)===filter)&&(!search||cardText(c).includes(search)));const pages=Math.max(1,Math.ceil(shown.length/pageSize));page=Math.min(page,pages-1);$('selectedCount').textContent='已选 '+selected.size+' 张';for(const b of $('bulkbar').querySelectorAll('[data-bulk]'))b.disabled=bulkBusy||selected.size===0;$('total').textContent=shown.length+' / '+cards.length+' 张';$('cards').innerHTML=shown.slice(page*pageSize,(page+1)*pageSize).map(c=>{const uid=esc(c.uid),open=expanded.has(c.uid),status=c.state==='ready'?'可用':c.state==='disabled'?'已停用':c.state==='uses_exhausted'?'次数已用完':c.state==='paused'?'已暂停':c.state==='reserved'?'处理中':c.state==='high_balance'?'嗨付高余额保护':c.state==='pro_protected'?'Pro 保护':c.state==='low_balance'?'余额不足':c.state==='upstream_missing'?'同步缺失':'需核查';const badge=category(c)==='ready'?'':' '+(category(c)==='disabled'?'off':'warn');return '<tr><td><input class="card-select" type="checkbox" data-select="'+uid+'" aria-label="选择尾号 '+esc(c.lastFour||'----')+'" '+(selected.has(c.uid)?'checked':'')+'><strong>•••• '+esc(c.lastFour||'----')+'</strong><br><span class="muted">'+esc(c.sourceLabel)+' · '+esc(c.id)+'</span></td><td>'+c.channels.map(x=>'<span class="badge">'+esc(x)+'</span>').join(' ')+' '+(!c.channels.length?'<span class="muted">当前不可轮选</span>':'')+'</td><td class="count">剩余 <strong>'+esc(c.remaining)+'</strong> / 总 '+esc(c.max)+'<br><span class="muted">已用 '+esc(c.used)+'</span>'+(c.frozen?'<br><span class="frozen">冻结 '+esc(c.frozen)+'</span>':'')+'</td><td>'+esc(c.kind==='h'&&c.balance!=null?'$'+Number(c.balance).toFixed(2):'—')+'</td><td><span class="badge'+badge+'">'+esc(status)+'</span></td><td><button class="secondary" data-expand="'+uid+'">'+(open?'收起':'管理')+'</button></td></tr>'+(open?'<tr class="detail"><td colspan="6">'+detail(c)+'</td></tr>':'')}).join('')||'<tr><td colspan="6">暂无匹配支付卡</td></tr>';$('pageInfo').textContent='第 '+(page+1)+' / '+pages+' 页';$('prev').disabled=page===0;$('next').disabled=page>=pages-1}
async function load(refresh=false){try{const [hr,zr,sr]=await Promise.allSettled([api('/api/admin/hifupay/cards'+(refresh?'?refresh=1':'')),api('/api/admin/zzshu/cards'),api('/api/admin/zzshu/import-status')]);if(hr.status==='rejected'&&zr.status==='rejected')throw Error('卡池暂时无法读取，请稍后刷新。');const h=hr.status==='fulfilled'?hr.value:{cards:[]},z=zr.status==='fulfilled'?zr.value:[],status=sr.status==='fulfilled'?sr.value:{ready:false,message:'手动卡导入状态暂不可用'};cards=normalize(h.cards||[],z||[]);for(const uid of selected)if(!cards.some(c=>c.uid===uid))selected.delete(uid);ready=Boolean(status.ready);$('importStatus').textContent=status.message||'';$('import').disabled=!ready||!$('import').dataset.previewed;render();const partial=hr.status==='rejected'||zr.status==='rejected';notice((partial?'部分卡片来源暂不可用，请稍后刷新。':refresh?'嗨付卡片已同步。':'已加载本地卡池。')+' 嗨付来源 '+(h.cards||[]).length+' 张，手动导入 '+(z||[]).filter(c=>c.credentialSource==='manual').length+' 张。'+(h.updatedAt?' 嗨付上次同步：'+new Date(h.updatedAt).toLocaleString('zh-CN',{hour12:false}):' 嗨付尚未同步。'),partial)}catch(e){notice(e.message,true)}}
$('cards').onchange=async e=>{const box=e.target.closest('[data-select]');if(box){box.checked?selected.add(box.dataset.select):selected.delete(box.dataset.select);render();return}const input=e.target.closest('[data-setting]');if(!input)return;try{await api('/api/admin/hifupay/cards/'+encodeURIComponent(input.dataset.id)+'/settings',{field:input.dataset.setting,value:Number(input.value)});await load();notice('卡片设置已保存。')}catch(err){notice(err.message,true)}};
$('selectPage').onclick=()=>{const search=$('search').value.trim().toLowerCase();const shown=cards.filter(c=>(filter==='all'||category(c)===filter)&&(!search||cardText(c).includes(search)));for(const c of shown.slice(page*pageSize,(page+1)*pageSize))selected.add(c.uid);render()};
$('clearSelection').onclick=()=>{selected.clear();render()};
$('bulkbar').onclick=async e=>{const button=e.target.closest('[data-bulk]');if(!button||bulkBusy)return;const targets=cards.filter(c=>selected.has(c.uid));if(!targets.length)return;const action=button.dataset.bulk;let cap;if(action==='cap'){const value=prompt('设置所选卡的总可用次数（含已用和冻结，1–100）');if(value===null)return;cap=Number(value);if(!Number.isInteger(cap)||cap<1||cap>100){notice('总次数需为 1–100 的整数。',true);return}}const label=action==='enable'?'启用':action==='disable'?'停用':'设置总次数为 '+cap;if(!confirm('确认批量'+label+' '+targets.length+' 张支付卡？'))return;bulkBusy=true;render();let completed=0;const errors=[];for(const c of targets){try{if(c.kind==='manual')await api('/api/admin/zzshu/cards/'+encodeURIComponent(c.id),action==='cap'?{maxSuccess:cap,note:c.note||''}:{enabled:action==='enable'});else await api('/api/admin/hifupay/cards/'+encodeURIComponent(c.id)+(action==='cap'?'/settings':'/'+action),action==='cap'?{field:'maxUses',value:cap}:{});selected.delete(c.uid);completed++}catch(err){errors.push('尾号 '+(c.lastFour||'----')+'：'+err.message)}}bulkBusy=false;await load();notice('批量'+label+'：成功 '+completed+' 张，失败 '+errors.length+' 张。'+(errors.length?'\n'+errors.join('\n'):'') ,errors.length>0)};
$('filters').onclick=e=>{const b=e.target.closest('[data-filter]');if(!b)return;filter=b.dataset.filter;page=0;render()};$('search').oninput=()=>{page=0;render()};$('prev').onclick=()=>{page--;render()};$('next').onclick=()=>{page++;render()};$('sync').onclick=()=>load(true);$('reload').onclick=()=>load();$('cards').onclick=async e=>{const toggle=e.target.closest('[data-expand]');if(toggle){expanded.has(toggle.dataset.expand)?expanded.delete(toggle.dataset.expand):expanded.add(toggle.dataset.expand);render();return}const b=e.target.closest('[data-action]');if(!b)return;const c=cards.find(x=>x.id===b.dataset.id&&x.kind===(b.dataset.action.startsWith('manual-')?'manual':'h'));if(!c)return;const action=b.dataset.action;try{if(action==='manual-cap'){const cap=prompt('总可用次数（包含已用和冻结次数）',c.max);if(cap===null)return;const note=prompt('备注',c.note||'');if(note===null)return;await api('/api/admin/zzshu/cards/'+encodeURIComponent(c.id),{maxSuccess:Number(cap),note})}else if(action==='manual-toggle')await api('/api/admin/zzshu/cards/'+encodeURIComponent(c.id),{enabled:!c.enabled});else if(action==='manual-retire'){if(!confirm('确认移出尾号 '+c.lastFour+'？支付资料将清除，历史记录保留。'))return;await api('/api/admin/zzshu/cards/'+encodeURIComponent(c.id)+'/retire',{})}else{if(action==='release'){const reason=prompt('请填写至少 8 字未扣款核查依据');if(reason===null)return;if(reason.trim().length<8)throw Error('核查依据至少 8 字');await api('/api/admin/hifupay/cards/'+encodeURIComponent(c.id)+'/release',{orderId:b.dataset.orderId,reason:reason.trim()})}else if(action==='protect-pro'){const account=prompt('Pro 账号',c.proReservation?.account||'');if(account===null)return;const type=prompt('升级类型，例如 20X Pro',c.proReservation?.type||'20X Pro');if(type===null)return;const renewalAt=prompt('预计续费日期 YYYY-MM-DD',c.proReservation?.renewalAt||'');if(renewalAt===null)return;await api('/api/admin/hifupay/cards/'+encodeURIComponent(c.id)+'/protect-pro',{account:account.trim(),type:type.trim(),renewalAt:renewalAt.trim()})}else{if(action==='release-pro'&&!confirm('确认解除 Pro 保护？'))return;await api('/api/admin/hifupay/cards/'+encodeURIComponent(c.id)+'/'+action,{})}}await load();notice('操作已保存。')}catch(err){notice(err.message,true)}};
$('importText').oninput=()=>{$('import').disabled=true;delete $('import').dataset.previewed};$('preview').onclick=async()=>{try{const rows=await api('/api/admin/zzshu/preview',{text:$('importText').value});$('previewRows').innerHTML=rows.map(r=>'<p>第 '+r.line+' 行 · '+esc(r.masked||'')+' · '+esc(r.status)+(r.error?' · '+esc(r.error):'')+'</p>').join('');$('import').dataset.previewed=rows.some(r=>r.status==='ready')?'1':'';$('import').disabled=!ready||!rows.some(r=>r.status==='ready')}catch(e){notice(e.message,true)}};$('import').onclick=async()=>{try{const rows=await api('/api/admin/zzshu/import',{text:$('importText').value,source:$('source').value.trim(),note:$('note').value,enabled:$('enabled').checked,maxSuccess:Number($('cap').value)});$('importText').value='';$('import').disabled=true;delete $('import').dataset.previewed;$('previewRows').textContent=rows.map(r=>'第 '+r.line+' 行 '+(r.masked||'')+' '+r.status).join(' · ');await load();notice('已导入 '+rows.filter(r=>r.status==='imported').length+' 张支付卡。')}catch(e){notice(e.message,true)}};
load();
</script></body></html>

<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="/admin/session.js"></script><title>Pro 订单与指定卡 | GPTC</title>
<style>body{font:15px system-ui,sans-serif;color:#172033;background:#f4f7fb;margin:0;padding:18px}main{max-width:1280px;margin:auto}section{background:white;border:1px solid #dce5ed;border-radius:14px;padding:20px;margin:12px 0}h1,h2{margin:0 0 10px}p,small{color:#607080}a{color:#087968}label{display:grid;gap:5px;font-weight:650}input,select,textarea,button{font:inherit;padding:10px;border-radius:8px;border:1px solid #bdcbd7}textarea{width:100%;box-sizing:border-box;min-height:85px}button{background:#087968;color:white;border:0;cursor:pointer}button:disabled{opacity:.55}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.table{overflow:auto}table{border-collapse:collapse;width:100%}th,td{padding:9px;border-bottom:1px solid #e5eaf0;text-align:left;white-space:nowrap}tr:hover{background:#f8fbfd}.warn{color:#ad4a00;font-weight:700}.status{white-space:pre-wrap;padding:10px;background:#eff8f5;border-radius:8px;margin:10px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f7fb;padding:10px}</style></head>
<body><main><section><h1>Pro 订单工作台</h1><p><a href="/admin/cards">卡密生成</a> · <a href="/admin/cards/library">卡密库</a> · <a href="/admin/hifupay/cards">嗨付卡池</a> · <a href="/admin/recoveries">其他充值记录</a></p><p>Pro 20x 始终人工；Pro 5x 只有选中付款卡且开启开关才自动提交。指定卡不进入 Plus 卡池。自动任务待确认期间，不要人工补充充值。</p></section>
<section><h2>Pro 5x 自动充值设置</h2><div class="grid"><label><span>自动充值</span><select id="enabled"><option value="false">关闭（默认人工）</option><option value="true">开启</option></select></label><label>指定付款卡<select id="cardId"><option value="">未选择</option></select></label><label>计费地区<input id="region" value="EG" maxlength="2"></label><label>预计扣款额 USD<input id="charge" type="number" min="0" step="0.01" value="0"></label><label>额外安全余额 USD<input id="buffer" type="number" min="0" step="0.01" value="0"></label></div><div class="actions"><button id="refreshCards">刷新卡片状态</button><button id="save">保存设置</button></div><p>预计扣款额需由运营确认；为 0 时无法开启自动充值。计费地区与代理节点分别配置，此处只修改计费地区。</p><div class="status" id="settingStatus">正在加载…</div></section>
<section><h2>订单</h2><div class="grid"><label>套餐<select id="plan"><option value="">全部</option><option value="pro_x5">Pro 5x</option><option value="pro_x20">Pro 20x</option></select></label><label>履约方式<select id="mode"><option value="">全部</option><option value="manual">人工</option><option value="auto">自动</option></select></label><label>状态<select id="status"><option value="">全部</option><option value="manual_queued">待人工</option><option value="manual_processing">人工处理中</option><option value="needs_info">需补资料</option><option value="queued">自动排队</option><option value="submitting">提交中</option><option value="processing">自动处理中</option><option value="needs_review">待确认</option><option value="success">成功</option></select></label></div><div class="actions"><button id="reload">刷新订单</button></div><div class="status" id="orderStatus">正在加载…</div><div class="table"><table><thead><tr><th>账号/订单</th><th>套餐/方式</th><th>来源</th><th>提交/等待</th><th>状态/说明</th><th>指定卡</th><th>操作</th></tr></thead><tbody id="orders"></tbody></table></div></section>
<section id="detailPanel" hidden><h2>订单详情</h2><div id="detail"></div><label>处理备注<textarea id="note" maxlength="1000" placeholder="记录处理进展（不粘贴密钥）"></textarea></label><div class="actions" id="detailActions"></div><details><summary>操作记录</summary><pre id="logs"></pre></details><div class="status" id="detailStatus"></div></section></main>
<script>
const api=window.adminApi, $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let records=[],selected=null;
const label={manual_queued:'待人工',manual_processing:'人工处理中',needs_info:'需补资料',queued:'自动排队',submitting:'提交中',processing:'自动处理中',needs_review:'待确认',success:'成功'};
async function settings(refresh=false){try{if(refresh)await api('/api/admin/hifupay/cards?refresh=1');const x=await api('/api/admin/pro/settings');$('enabled').value=String(x.enabled);$('region').value=x.region;$('charge').value=x.estimatedChargeUsd;$('buffer').value=x.safetyBufferUsd;$('cardId').innerHTML='<option value="">未选择</option>'+x.cards.map(c=>'<option value="'+esc(c.id)+'">ID '+esc(c.id)+' · ****'+esc(c.lastFour)+' · 余额 '+esc(c.balance??'未知')+' / 可用 '+esc(c.availableBalance??'未知')+' · 占用 '+c.inFlightCount+' · '+esc(c.poolStatus)+'</option>').join('');$('cardId').value=x.cardId;$('settingStatus').textContent='当前：'+(x.enabled?'自动充值已开启':'人工模式（自动关闭）')+(x.cardId?' · 指定卡 ID '+x.cardId:' · 未指定卡');}catch(e){$('settingStatus').textContent=e.message}}
async function load(){try{records=(await api('/api/admin/pro/orders')).orders;render()}catch(e){$('orderStatus').textContent=e.message}}
function render(){const rows=records.filter(x=>(!$('plan').value||x.plan===$('plan').value)&&(!$('mode').value||x.fulfillmentMode===$('mode').value)&&(!$('status').value||x.status===$('status').value));$('orderStatus').textContent=`${rows.length} / ${records.length} 笔 · 待人工 ${records.filter(x=>['manual_queued','manual_processing','needs_info'].includes(x.status)).length} · 待确认 ${records.filter(x=>x.status==='needs_review').length}`;$('orders').innerHTML=rows.map(x=>'<tr><td>'+esc(x.userEmail)+'<br><small>'+esc(x.id)+'</small></td><td>'+esc(x.plan==='pro_x5'?'Pro 5x':'Pro 20x')+' / '+esc(x.fulfillmentMode==='auto'?'自动':'人工')+'</td><td>'+esc(x.source)+'</td><td>'+esc(new Date(x.createdAt).toLocaleString())+'<br>'+x.waitingMinutes+' 分钟</td><td class="'+(x.status==='needs_review'?'warn':'')+'">'+esc(label[x.status]||x.status)+'<br><small>'+esc(x.message)+'</small></td><td>'+esc(x.hifupayCardId||'-')+(x.hifupayCardLastFour?' ****'+esc(x.hifupayCardLastFour):'')+'</td><td><button data-id="'+esc(x.id)+'">打开</button></td></tr>').join('')||'<tr><td colspan="7">暂无匹配订单</td></tr>'}
async function openOrder(id){try{selected=await api('/api/admin/pro/orders/'+encodeURIComponent(id));$('detailPanel').hidden=false;$('detail').innerHTML='<p>账号：'+esc(selected.userEmail)+'　套餐：'+esc(selected.plan==='pro_x5'?'Pro 5x':'Pro 20x')+'　订单：'+esc(selected.id)+'　方式：'+esc(selected.fulfillmentMode)+'　状态：'+esc(label[selected.status]||selected.status)+'</p><p>来源：'+esc(selected.source)+'　提交：'+esc(new Date(selected.createdAt).toLocaleString())+'　指定卡：'+esc(selected.hifupayCardId||'-')+'</p>';$('note').value=selected.processingNote||'';$('logs').textContent=(selected.logs||[]).map(x=>x.createdAt+' '+x.step).join('\n');const actions=[['copy','复制原始 JSON'],['note','保存备注']];if(selected.fulfillmentMode==='manual'&&selected.status!=='success')actions.push(['manual-processing','人工处理中'],['needs-info','需补资料'],['mark-success','确认人工充值成功']);if(selected.fulfillmentMode==='auto'&&selected.status==='needs_review')actions.push(['confirm-no-charge','核实未扣款并转人工']);$('detailActions').innerHTML=actions.map(([a,t])=>'<button data-action="'+a+'">'+t+'</button>').join('');$('detailStatus').textContent='订单详情已加载。';$('detailPanel').scrollIntoView({behavior:'smooth'});}catch(e){$('orderStatus').textContent=e.message}}
$('save').onclick=async()=>{try{const x=await api('/api/admin/pro/settings',{method:'POST',body:JSON.stringify({enabled:$('enabled').value==='true',cardId:$('cardId').value,region:$('region').value,estimatedChargeUsd:Number($('charge').value),safetyBufferUsd:Number($('buffer').value)})});$('settingStatus').textContent='已保存，自动充值：'+(x.enabled?'开启':'关闭')}catch(e){$('settingStatus').textContent=e.message}};
$('refreshCards').onclick=()=>settings(true);$('reload').onclick=load;for(const id of ['plan','mode','status'])$(id).onchange=render;$('orders').onclick=e=>{const b=e.target.closest('[data-id]');if(b)openOrder(b.dataset.id)};
$('detailActions').onclick=async e=>{const b=e.target.closest('[data-action]');if(!b||!selected)return;const action=b.dataset.action;if(action==='copy'){if(!selected.secretJsonText){$('detailStatus').textContent='原始 JSON 已按保留策略清理。';return}await navigator.clipboard.writeText(selected.secretJsonText);$('detailStatus').textContent='原始 JSON 已复制；请仅用于履约。';return}const note=$('note').value;if(action==='mark-success'&&!confirm(`确认外部人工充值已成功？\n账号：${selected.userEmail}\n套餐：${selected.plan}\n订单：${selected.id}\n此操作只同步本站，不会调用充值接口。`))return;if(action==='confirm-no-charge'&&!confirm(`请确认原任务未扣款且未成功。订单 ${selected.id} 将释放指定卡占用并转人工；无法确定时请取消。`))return;try{await api('/api/admin/pro/orders/'+encodeURIComponent(selected.id)+'/'+action,{method:'POST',body:JSON.stringify({note,confirmedNoCharge:action==='confirm-no-charge'})});$('detailStatus').textContent='操作已记录。';await load();await openOrder(selected.id)}catch(err){$('detailStatus').textContent=err.message}};
settings();load();setInterval(load,10000);
</script></body></html>

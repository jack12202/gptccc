<!doctype html><html lang="zh-CN"><head><script src="/admin/session.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>支付卡池 · ZZS｜GPTC 后台</title><style>*{box-sizing:border-box}body{font:15px system-ui;background:#f4f7fb;color:#142536;margin:0;padding:24px}main{max-width:1180px;margin:auto}section{background:#fff;border:1px solid #dce5ee;border-radius:14px;margin:16px 0;padding:20px}h1,h2{margin:0 0 10px}p{color:#64748b;line-height:1.6}.tabs{display:flex;gap:8px}.tabs a{padding:11px 16px;border:1px solid #cbd5e1;border-radius:10px;text-decoration:none;color:#475569;font-weight:800;background:#fff}.tabs a.active{background:#0f766e;color:#fff}input,textarea,button{font:inherit;padding:10px;border:1px solid #bac9d8;border-radius:8px;margin:3px}textarea{display:block;width:100%;min-height:120px}button{cursor:pointer;background:#0f766e;color:#fff;font-weight:800}button.secondary{background:#ecfdf5;color:#0f766e}button.danger{background:#fff1f2;color:#be123c;border-color:#fda4af}button:disabled{opacity:.5;cursor:not-allowed}.grid{display:grid;grid-template-columns:1fr 1fr 160px;gap:10px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid #e5edf2;padding:9px;text-align:left}.wrap{overflow:auto}.warn{color:#a54700}.error{color:#aa2630}.ok{color:#087757}.notice{padding:12px;border-radius:9px;background:#eff6ff;color:#1e3a8a}details{margin-top:12px;border:1px solid #dce5ee;border-radius:8px;padding:10px}summary{cursor:pointer;font-weight:700}@media(max-width:700px){body{padding:12px}.grid{grid-template-columns:1fr}.tabs a{flex:1;text-align:center}}</style></head><body><main>
<nav class="tabs"><a href="/admin/hifupay/cards">嗨付支付卡</a><a class="active" href="/admin/hifupay/cards?tab=zzshu">ZZS 支付卡</a></nav>
<section><h1>支付卡池 · ZZS</h1><p>API 配置和 Plus 通道切换在<a href="/admin">总览</a>；订单和用户 JSON 在<a href="/admin/recoveries">充值订单</a>。</p><div id="notice" class="notice">正在加载本地卡池…</div></section>
<section><h2>批量导入支付卡</h2><p>每行一张：卡号,MM/YY,CVV。系统自动拆分，页面只显示尾号。</p><p id="importStatus"></p><textarea id="cards" autocomplete="off" spellcheck="false"></textarea><div class="grid"><label>来源<input id="source" value="手动导入"></label><label>备注<input id="note"></label><label>总可用次数<input id="cap" type="number" min="1" max="100" value="1"></label></div><label><input id="enabled" type="checkbox" checked>导入后启用</label><div class="actions"><button id="preview">脱敏预览</button><button id="import" disabled>确认导入</button></div><div id="previewRows"></div></section>
<section><h2>ZZS 支付卡</h2><p>修改总次数不会清除已成功次数。移出卡池后将清除该卡的支付资料，保留历史记录和重复卡识别，不能再启用或重新导入。</p><div class="wrap" id="pool"></div></section>
<section><h2>嗨付卡分配给 ZZS</h2><p>高级操作：只有确实需要让 ZZS 使用嗨付支付卡时再分配。</p><button id="sync" class="secondary">同步嗨付卡池</button><details><summary>展开高级分配</summary><div class="wrap" id="assignments"></div></details></section>
</main><script>
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const api=(p,b)=>window.adminApi('/api/admin/zzshu/'+p,{method:b?'POST':'GET',...(b?{body:JSON.stringify(b)}:{})});const channel=new BroadcastChannel('gptc-hifupay-card-sync');let ready=false;function msg(s,e=false){$('notice').textContent=s;$('notice').className='notice'+(e?' error':'')}
async function load(){try{const [cards,hcards,state]=await Promise.all([api('cards'),api('hifupay-cards'),api('import-status')]);ready=state.ready;$('importStatus').textContent=state.message;$('importStatus').className=ready?'ok':'warn';const manual=cards.filter(c=>c.credentialSource==='manual');$('pool').innerHTML='<table><tr><th>支付卡</th><th>次数</th><th>占用</th><th>状态</th><th>管理</th></tr>'+manual.map(c=>'<tr><td>****'+esc(c.lastFour)+'<br>'+esc(c.source)+(c.note?' · '+esc(c.note):'')+'<details><summary>已充值账号（'+(c.successfulAccounts||[]).length+'）</summary>'+(c.pendingAccount?'<p class="warn">处理中或待核查：'+esc(c.pendingAccount.email||c.pendingAccount.accountId||'未知账号')+'</p>':'')+((c.successfulAccounts||[]).map(a=>'<p>'+esc(a.email||a.accountId||'未知账号')+(a.email&&a.accountId?'<br><small>账号 ID：'+esc(a.accountId)+'</small>':'')+'<br><small>提交：'+esc(a.submittedAt?new Date(a.submittedAt).toLocaleString('zh-CN',{hour12:false}):'-')+'</small></p>').join('')||'<p>暂无成功充值记录</p>')+'</details></td><td>成功 '+c.successCount+' / 总计 '+c.maxSuccess+' / 剩余 '+c.remainingUses+'</td><td>'+esc(c.occupiedOrderId||'-')+'</td><td>'+esc(c.occupiedOrderId?'使用中或待确认':!c.enabled?'已停用':c.paused?'已暂停':c.remainingUses===0?'已耗尽':'可用')+'</td><td><button data-card="'+esc(c.id)+'" data-enabled="'+(c.enabled?0:1)+'">'+(c.enabled?'停用':'启用')+'</button><button class="secondary" data-cap="'+esc(c.id)+'" data-current="'+c.maxSuccess+'" data-note="'+esc(c.note)+'">调整</button>'+(c.paused?'<button data-resume="'+esc(c.id)+'">恢复</button>':'')+'<button class="danger" data-retire="'+esc(c.id)+'" data-last-four="'+esc(c.lastFour)+'" '+(c.occupiedOrderId?'disabled':'')+'>永久删除</button></td></tr>').join('')+'</table>';$('assignments').innerHTML='<table><tr><th>嗨付支付卡</th><th>余额/状态</th><th>用途</th><th>操作</th></tr>'+hcards.map(c=>'<tr><td>ID '+esc(c.id)+' · ****'+esc(c.lastFour)+'</td><td>'+(c.balance==null?'未知':'$'+esc(c.balance))+' / '+esc(c.status)+'</td><td>'+(c.role==='zzshu'?'ZZS 专用':'嗨付专用')+(c.occupied?' · 占用中':'')+'</td><td><button data-assign="'+esc(c.id)+'" data-role="'+(c.role==='zzshu'?'h':'zzshu')+'" '+(c.occupied?'disabled':'')+'>'+(c.role==='zzshu'?'改回嗨付':'分配给 ZZS')+'</button></td></tr>').join('')+'</table>';msg('已从本站数据库加载 '+manual.length+' 张 ZZS 手动支付卡。')}catch(e){msg(e.message,true)}}
$('preview').onclick=async()=>{try{const rows=await api('preview',{text:$('cards').value});$('previewRows').innerHTML=rows.map(r=>'<p class="'+(r.status==='error'?'error':'')+'">第 '+r.line+' 行 · '+esc(r.masked||'')+' · '+esc(r.status)+' '+esc(r.error||'')+'</p>').join('');$('import').disabled=!ready||!rows.some(r=>r.status==='ready');msg('请核对脱敏预览。')}catch(e){msg(e.message,true)}};$('cards').oninput=()=>{$('import').disabled=true;$('previewRows').textContent='内容已修改，请重新预览。'};
$('import').onclick=async()=>{try{const rows=await api('import',{text:$('cards').value,source:$('source').value.trim(),note:$('note').value,enabled:$('enabled').checked,maxSuccess:Number($('cap').value)});$('cards').value='';$('import').disabled=true;$('previewRows').textContent=rows.map(r=>'第 '+r.line+' 行 '+(r.masked||'')+' '+r.status+(r.error?'：'+r.error:'')).join(' · ');await load();msg('已导入 '+rows.filter(r=>r.status==='imported').length+' 张；失败或重复 '+rows.filter(r=>['error','duplicate'].includes(r.status)).length+' 张。',rows.some(r=>r.status==='error'))}catch(e){msg(e.message,true)}};$('sync').onclick=async()=>{try{await api('hifupay-cards?refresh=1');channel.postMessage('refreshed');await load();msg('嗨付卡池同步完成。')}catch(e){msg(e.message,true)}};
document.body.onclick=async e=>{const b=e.target.closest('[data-assign],[data-card],[data-cap],[data-resume],[data-retire]');if(!b)return;try{if(b.dataset.retire){if(!confirm('确认将尾号 '+b.dataset.lastFour+' 的手动卡永久移出卡池？支付资料会清除，历史成功次数保留，之后不能重新导入同一张卡。'))return;await api('cards/'+encodeURIComponent(b.dataset.retire)+'/retire',{});await load();msg('支付卡已删除，不能再次选中或重新导入。');return}if(b.dataset.assign){if(!confirm('确认更改此卡的专用通道？已有订单不会迁移。'))return;await api('hifupay-cards/'+encodeURIComponent(b.dataset.assign)+'/assign',{role:b.dataset.role})}if(b.dataset.card)await api('cards/'+encodeURIComponent(b.dataset.card),{enabled:Boolean(Number(b.dataset.enabled))});if(b.dataset.cap){const cap=prompt('总可用次数（包含已成功次数，不是追加次数）',b.dataset.current);if(cap===null)return;const note=prompt('备注',b.dataset.note||'');if(note===null)return;await api('cards/'+encodeURIComponent(b.dataset.cap),{maxSuccess:Number(cap),note})}if(b.dataset.resume){if(!confirm('确认排查失败原因并恢复此卡？'))return;await api('cards/'+encodeURIComponent(b.dataset.resume),{resume:true})}await load()}catch(err){msg(err.message,true)}};channel.onmessage=load;load();
</script></body></html>
